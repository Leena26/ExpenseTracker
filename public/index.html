<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Receipt OCR - Demo</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: auto }
      .row { display:flex; gap:16px; align-items:center }
      button { padding:8px 12px }
      #parsed { white-space: pre-wrap; background:#f7f7f7; padding:12px; margin-top:12px }
      canvas { max-width:100%; }
    </style>
  </head>
  <body>
    <h1>Receipt Upload (Demo)</h1>

    <form id="uploadForm">
      <div class="row">
        <input type="file" id="file" name="file" accept="image/*,.pdf" />
        <button type="submit">Upload</button>
      </div>
    </form>

    <h2>Parsed Result</h2>
    <div id="parsed">No upload yet.</div>

    <h2>Analytics</h2>
    <div>
      <canvas id="chart" width="600" height="300"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    const form = document.getElementById('uploadForm');
    const parsedEl = document.getElementById('parsed');
    const chartCtx = document.getElementById('chart').getContext('2d');
    let chart;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('file');
      if (!fileInput.files.length) return alert('Choose a file');

      const fd = new FormData();
      fd.append('file', fileInput.files[0]);

      parsedEl.textContent = 'Uploading...';
      const res = await fetch('/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (res.ok) {
        parsedEl.textContent = JSON.stringify(data.parsed, null, 2);
        await refreshAnalytics();
      } else {
        parsedEl.textContent = 'Error: ' + (data.error || JSON.stringify(data));
      }
    });

    async function refreshAnalytics() {
      const res = await fetch('/api/expenses');
      const rows = await res.json();

      // Simple analytics: total amount and count by category
      const byCategory = {};
      let total = 0;
      rows.forEach(r => {
        const amt = Number(r.amount) || 0;
        total += amt;
        const cat = r.category || 'uncategorized';
        byCategory[cat] = (byCategory[cat] || 0) + amt;
      });

      const labels = Object.keys(byCategory);
      const values = labels.map(l => byCategory[l]);

      if (chart) chart.destroy();
      chart = new Chart(chartCtx, {
        type: 'pie',
        data: { labels, datasets: [{ data: values, backgroundColor: ['#4dc9f6','#f67019','#f53794','#537bc4','#acc236'] }] },
        options: { plugins: { title: { display: true, text: `Total: $${total.toFixed(2)} (${rows.length} receipts)` } } }
      });
    }

    // initial load
    refreshAnalytics();
    </script>
  </body>
</html>
